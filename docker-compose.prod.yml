services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend.env

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMINIO: ${'$'}{DOMINIO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: