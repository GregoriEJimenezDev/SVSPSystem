<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVSP - Iniciar Sesión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #faf8f3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container { max-width: 520px; width: 100%; padding: 24px; }
        .login-box {
            background: #fff;
            padding: 64px 56px;
            border-radius: 24px;
            box-shadow: 0 24px 48px rgba(180, 140, 40, 0.16);
            border: 1px solid #f0e6cf;
        }
        .logo { text-align: center; margin-bottom: 36px; }
        .logo-icon {
            width: 84px; height: 84px;
            background: linear-gradient(135deg, #D4A843 0%, #B8912F 100%);
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 12px 28px rgba(180, 140, 40, 0.35);
            font-size: 40px; color: #fff; font-weight: 700;
        }
        h2 { text-align: center; color: #2c2c2c; font-size: 34px; font-weight: 700; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #8a8a8a; font-size: 17px; margin-bottom: 40px; }
        .form-group { margin-bottom: 26px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; color: #444; font-size: 16px; }
        .form-group input {
            width: 100%; padding: 18px 20px;
            border: 1px solid #e8e0d0; border-radius: 12px;
            font-size: 18px; background: #fafaf8;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .form-group input:focus {
            outline: none; border-color: #C49838; background: #fff;
            box-shadow: 0 0 0 4px rgba(196, 152, 56, 0.18);
        }
        .btn {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, #D4A843 0%, #B8912F 100%);
            color: #fff; border: none; border-radius: 12px;
            font-size: 19px; font-weight: 700; cursor: pointer; margin-top: 10px;
            box-shadow: 0 6px 18px rgba(180, 140, 40, 0.35);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(180, 140, 40, 0.45); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: .75; cursor: wait; transform: none; }
        .error {
            background: #fff0f0; border: 1px solid #fecaca; color: #b91c1c;
            padding: 14px 18px; border-radius: 12px; margin-bottom: 24px;
            display: none; font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo"><div class="logo-icon">S</div></div>
            <h2>Iniciar Sesión</h2>
            <p class="subtitle">SVSP - Sistema de Gestión de Asistencia y Visitas</p>
            <div id="error" class="error" role="alert"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="Ingrese su correo" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingrese su contraseña" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="submitBtn">Entrar al Sistema</button>
            </form>
        </div>
    </div>
    <script>
        var loginForm = document.getElementById('loginForm');
        var errorDiv = document.getElementById('error');
        var submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Ingresando...';

            fetch('http://localhost:8000/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(function (response) {
                return response.json().then(function (data) {
                    return { ok: response.ok, status: response.status, data: data };
                });
            })
            .then(function (result) {
                if (result.ok) {
                    localStorage.setItem('user_token', result.data.access_token);
                    localStorage.setItem('user_modules', JSON.stringify(result.data.user.modules || []));
                    window.location.href = 'http://localhost:5173/dashboard';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = (result.data && result.data.detail) || 'Credenciales incorrectas';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Entrar al Sistema';
                }
            })
            .catch(function (err) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'No se pudo conectar al servidor. Verifique que el backend este corriendo en el puerto 8000.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar al Sistema';
            });
        });

        if (localStorage.getItem('user_token')) {
            window.location.href = 'http://localhost:5173/dashboard';
        }
    </script>
</body>
</html>
