<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVSP - Iniciar Sesión</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #faf8f3 url('/bg-login.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(250, 248, 243, 0.85);
            z-index: 0;
            pointer-events: none;
        }
        body > * { position: relative; z-index: 1; }

        .login-container {
            width: 100%;
            max-width: 340px;
        }

        .login-box {
            background: #ffffff;
            padding: 36px 28px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(180, 140, 40, 0.1);
            border: 1px solid #f0e6cf;
        }

        .shield-container {
            text-align: center;
            margin-bottom: 24px;
        }
        .shield {
            width: 56px; height: 68px;
            margin: 0 auto 10px;
        }
        .shield-svg { width: 100%; height: 100%; }
        .shield-title {
            font-size: 11px;
            font-weight: 700;
            color: #2c2c2c;
            line-height: 1.4;
        }
        .shield-country {
            font-size: 9px;
            font-weight: 500;
            color: #8a8a8a;
            margin-top: 1px;
        }

        h2.login-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #2c2c2c;
            margin-bottom: 4px;
        }
        .login-subtitle {
            text-align: center;
            color: #8a8a8a;
            font-size: 12px;
            margin-bottom: 24px;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #444;
            font-size: 11px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #fafaf8;
            border: 1px solid #e8e0d0;
            border-radius: 10px;
            font-size: 13px;
            color: #2c2c2c;
            font-family: 'Inter', sans-serif;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
            outline: none;
        }
        .form-group input:focus {
            border-color: #C49838;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(196, 152, 56, 0.15);
        }
        .form-group input::placeholder { color: #c8c0b0; }
        .form-group input.pre-filled {
            color: #b8912f;
            font-weight: 600;
        }
        .form-group input.dots-input {
            letter-spacing: 6px;
            color: #c8c0b0;
        }

        .btn {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #D4A843 0%, #B8912F 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            font-family: 'Inter', sans-serif;
            transition: transform .15s ease, box-shadow .15s ease;
            box-shadow: 0 4px 14px rgba(180, 140, 40, 0.3);
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(180, 140, 40, 0.4);
        }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.65; cursor: wait; transform: none; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 0.5px;
            background: #f0e6cf;
        }
        .divider span {
            font-size: 9px;
            color: #b8912f;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .login-footer {
            text-align: center;
            margin-top: 4px;
        }
        .login-footer p {
            color: #b8912f;
            font-size: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <!-- Shield Emblem -->
            <div class="shield-container">
                <div class="shield">
                    <svg class="shield-svg" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#1a3a6a" />
                                <stop offset="100%" style="stop-color:#0d2137" />
                            </linearGradient>
                            <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#D4A843" />
                                <stop offset="50%" style="stop-color:#B8912F" />
                                <stop offset="100%" style="stop-color:#D4A843" />
                            </linearGradient>
                        </defs>
                        <path d="M50 4 L90 24 L90 65 C90 92 72 112 50 116 C28 112 10 92 10 65 L10 24 Z"
                              fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
                        <path d="M50 12 L80 30 L80 63 C80 85 66 100 50 103 C34 100 20 85 20 63 L20 30 Z"
                              fill="none" stroke="rgba(180,140,40,0.3)" stroke-width="0.8"/>
                        <polygon points="50,32 55,43 67,43 58,50 61,62 50,55 39,62 42,50 33,43 45,43"
                                 fill="#D4A843" opacity="0.9"/>
                        <rect x="16" y="70" width="68" height="3" rx="1" fill="rgba(180,140,40,0.5)"/>
                        <rect x="16" y="77" width="68" height="3" rx="1" fill="rgba(180,140,40,0.2)"/>
                        <rect x="16" y="84" width="68" height="3" rx="1" fill="rgba(180,140,40,0.5)"/>
                    </svg>
                </div>
                <div class="shield-title">Superintendencia de Vigilancia y Seguridad Privada</div>
                <div class="shield-country">Republica Dominicana</div>
            </div>

            <h2 class="login-title">Iniciar Sesión</h2>
            <p class="login-subtitle">Sistema de Gestión de Asistencia y Visitas</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="pre-filled" value="admin@svsp.local" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="dots-input" placeholder="........." required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="submitBtn">Entrar al Sistema</button>
            </form>

            <div class="divider"><span>SYS</span></div>

            <div class="login-footer">
                <p>Secure Access Portal</p>
            </div>
        </div>
    </div>

    <script>
        var loginForm = document.getElementById('loginForm');
        var submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';

            fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(function (response) {
                return response.json().then(function (data) {
                    return { ok: response.ok, status: response.status, data: data };
                });
            })
            .then(function (result) {
                if (result.ok) {
                    localStorage.setItem('user_token', result.data.access_token);
                    localStorage.setItem('user_modules', JSON.stringify(result.data.user.modules || []));
                    window.location.href = '/dashboard';
                } else {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Entrar al Sistema';
                    alert((result.data && result.data.detail) || 'Credenciales incorrectas');
                }
            })
            .catch(function (err) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar al Sistema';
                alert('No se pudo conectar al servidor. Verifique que el backend está corriendo en el puerto 8000.');
            });
        });

        if (localStorage.getItem('user_token')) {
            window.location.href = 'http://localhost:5173/dashboard';
        }
    </script>
</body>
</html>
